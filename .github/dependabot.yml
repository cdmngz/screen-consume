version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    target-branch: "main"
    open-pull-requests-limit: 4
    assignees:
      - "cdmngz"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    target-branch: "main"
    open-pull-requests-limit: 6
    assignees:
      - "cdmngz"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 14
      include:
        - "com.android.application"
        - "org.jetbrains.kotlin.android"
        - "org.jetbrains.kotlin.plugin.compose"
        - "com.google.devtools.ksp"
    groups:
      room:
        patterns:
          - "androidx.room:*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.room:*"
        update-types:
          - "minor"
          - "patch"
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin.android"
          - "org.jetbrains.kotlin.plugin.compose"
          - "com.google.devtools.ksp"
        update-types:
          - "minor"
          - "patch"
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines-*"
